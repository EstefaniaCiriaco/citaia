name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update nmp
        run: npm install -g npm@11.19.1
      - name: Install dependencies
        run: npm install
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare Pages folder
        run: |
          # The static site is emitted to dist/client; publish it as the dist folder.
          rm -rf pages && cp -r dist/client pages
          cp pages/index.html pages/404.html
          touch pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
